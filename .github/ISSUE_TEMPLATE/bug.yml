name: Bug report
description: A reproducible problem in app, content or build
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version / commit
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot / logs / question ID
