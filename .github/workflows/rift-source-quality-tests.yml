name: RIFT Source Quality Tests
on:
  pull_request:
    paths:
      - 'source_discovery/**'
      - '.github/workflows/rift-link-enumeration.yml'
      - '.github/workflows/rift-source-quality-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-source-index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and regression tests (no downloads)
        run: |
          python -m compileall -q source_discovery
          python -m unittest discover -s source_discovery -p 'test_*.py' -v
