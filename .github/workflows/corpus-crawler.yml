name: Olympiad corpus crawler

on:
  workflow_dispatch:
    inputs:
      max_documents:
        description: Maximum documents to download in this run
        required: false
        default: "50"
  schedule:
    - cron: "17,47 * * * *"
  push:
    paths:
      - ".github/workflows/corpus-crawler.yml"
      - "tools/corpus_ingest/crawler.py"
      - "tools/corpus_ingest/crawler_requirements.txt"
      - "tools/corpus_ingest/registry/**"
      - "tools/corpus_ingest/tests/test_crawler.py"

permissions:
  contents: write
  actions: write

concurrency:
  group: olympiad-crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: tools/corpus_ingest
    env:
      DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
      DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
      DROPBOX_ROOT: /OlympiadCorpus
      MAX_DOCUMENTS: ${{ github.event.inputs.max_documents || '50' }}
      MAX_FILE_BYTES: "104857600"
      DROPBOX_QUOTA_BYTES: "2147483648"
      DROPBOX_STOP_AT_RATIO: "0.95"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install crawler dependencies
        run: pip install -r crawler_requirements.txt

      - name: Test crawler
        run: PYTHONPATH=. pytest -q tests/test_crawler.py

      - name: Dropbox setup status
        if: env.DROPBOX_APP_KEY == '' || env.DROPBOX_APP_SECRET == '' || env.DROPBOX_REFRESH_TOKEN == ''
        run: echo "Dropbox secrets are not configured; crawler download step is skipped."

      - name: Crawl and upload RAW
        if: env.DROPBOX_APP_KEY != '' && env.DROPBOX_APP_SECRET != '' && env.DROPBOX_REFRESH_TOKEN != ''
        run: python crawler.py --sources registry/sources.csv --state state/crawl_state.jsonl

      - name: Commit crawler state
        if: env.DROPBOX_APP_KEY != '' && env.DROPBOX_APP_SECRET != '' && env.DROPBOX_REFRESH_TOKEN != ''
        working-directory: ${{ github.workspace }}
        run: |
          STATE_FILE="tools/corpus_ingest/state/crawl_state.jsonl"
          cp "$STATE_FILE" /tmp/crawl_state.jsonl

          git config user.name "olympiad-crawler[bot]"
          git config user.email "olympiad-crawler[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4; do
            echo "Publishing crawler state, attempt $attempt/4"

            # Start from the newest main so code/docs/parser changes made during
            # a long crawl never cause a non-fast-forward state push.
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/crawl_state.jsonl "$STATE_FILE"

            if git diff --quiet -- "$STATE_FILE"; then
              echo "Remote main already has this crawler state"
              exit 0
            fi

            git add "$STATE_FILE"
            git commit -m "crawler: update corpus state [skip ci]"

            if git push origin HEAD:main; then
              echo "Crawler state published successfully"
              exit 0
            fi

            echo "main changed again while publishing state; retrying"
            sleep $((attempt * 2))
          done

          echo "::error::Could not publish crawler state after 4 attempts"
          exit 1

      - name: Continue next batch
        if: env.DROPBOX_APP_KEY != '' && env.DROPBOX_APP_SECRET != '' && env.DROPBOX_REFRESH_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("run_summary.json")
          if not p.exists():
              print("No run summary; not chaining")
              raise SystemExit(0)
          s = json.loads(p.read_text(encoding="utf-8"))
          print(json.dumps({
              "processed": s.get("processed"),
              "remaining": s.get("remaining"),
              "warning": s.get("warning"),
              "should_continue": s.get("should_continue"),
          }, ensure_ascii=False))
          if s.get("should_continue"):
              Path("/tmp/continue_crawler").write_text("1")
          PY
          if [ -f /tmp/continue_crawler ]; then
            gh workflow run corpus-crawler.yml --ref main -f max_documents=50
            echo "Queued next crawler batch"
          else
            echo "Crawler chain stopped cleanly"
          fi
