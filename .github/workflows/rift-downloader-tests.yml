name: RIFT Downloader Unit Tests
on:
  push:
    branches: [feature/rift-downloader-mvp, rift-source-index]
    paths:
      - 'rift_downloader/**'
      - '.github/workflows/rift-downloader-tests.yml'
  pull_request:
    paths:
      - 'rift_downloader/**'
      - '.github/workflows/rift-downloader-tests.yml'
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install downloader and Drive API dependencies
        run: python -m pip install -r rift_downloader/requirements.txt
      - name: Verify Google Drive SDK import without credentials
        run: python -c 'import googleapiclient.discovery, google_auth_oauthlib.flow'
      - name: Compile and test without external HTTP / Drive
        run: |
          python -m compileall -q rift_downloader
          python -m unittest discover -s rift_downloader/tests -v
      - name: Verify Colab notebook is valid and all Python cells compile
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          notebook=json.loads(Path('rift_downloader/RIFT_200_File_Pilot.ipynb').read_text())
          assert notebook['nbformat']==4
          codes=[cell for cell in notebook['cells'] if cell['cell_type']=='code']
          assert len(codes)==3
          for cell in codes:
              compile(''.join(cell['source']),'<RIFT_Colab>', 'exec')
          print('Colab notebook: JSON valid, three Python cells compile')
          PY
      - name: Offline import and count existing RIFT resource shards
        run: |
          python -m rift_downloader.cli --db /tmp/rift_pilot_smoke.sqlite3 import 'source_discovery/resources_shards/resource_*.jsonl'
          python -m rift_downloader.cli --db /tmp/rift_pilot_smoke.sqlite3 status
          python -m rift_downloader.cli --db /tmp/rift_pilot_smoke.sqlite3 plan --sample 5
          python -m rift_downloader.cli --db /tmp/rift_pilot_smoke.sqlite3 seed --limit 5000
          python -m rift_downloader.ops_metrics --baseline --output /tmp/rift_baseline.html --json /tmp/rift_baseline.json
          python -m rift_downloader.ops_metrics --db /tmp/rift_pilot_smoke.sqlite3 --output /tmp/rift_live.html --json /tmp/rift_live.json
          python -m rift_downloader.cloud_runner --help
