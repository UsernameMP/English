name: RIFT Link Enumeration
# Paused by user for RIFT 200-file downloader pilot. Manual invocation only.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rift-source-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout index branch
        uses: actions/checkout@v4
        with:
          ref: rift-source-index
          persist-credentials: true
      - name: Verify discovery and crawler regressions
        run: |
          python -m py_compile source_discovery/crawl_links.py source_discovery/merge_sources.py source_discovery/link_intelligence.py source_discovery/build_resource_index.py source_discovery/merge_review_checkpoints.py source_discovery/apply_review_corrections.py
          python -m unittest discover -s source_discovery -p 'test_*.py' -v
      - name: Merge discovered sources into the registry
        run: python source_discovery/merge_sources.py
      - name: Merge audited Review checkpoints into canonical labels
        continue-on-error: true
        run: python source_discovery/merge_review_checkpoints.py
      - name: Apply SHA-pinned audited label corrections
        continue-on-error: true
        run: python source_discovery/apply_review_corrections.py
      - name: Enumerate publicly accessible HTML links
        env:
          RIFT_PAGES_PER_RUN: "60"
          RIFT_PAGES_PER_SITE: "12"
          RIFT_MAX_DEPTH: "6"
        run: python source_discovery/crawl_links.py
      - name: Build deduplicated link resource index
        run: python source_discovery/build_resource_index.py
      - name: Persist results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source_discovery/link_labels.jsonl source_discovery/sources.jsonl source_discovery/links_raw.jsonl source_discovery/links_shards source_discovery/crawl_state.json source_discovery/resource_observations.jsonl source_discovery/resources_shards
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "RIFT: checkpoint link crawl"
          # Retry a moving remote ref, but never force-push or discard a rebase conflict.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin rift-source-index
            if git push origin HEAD:rift-source-index; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "RIFT: push still rejected after five safe ref refresh attempts" >&2
              exit 1
            fi
            sleep $((2 * attempt))
          done
