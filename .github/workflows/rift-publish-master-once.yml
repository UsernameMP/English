name: RIFT publish canonical RU-first URL master (one-time)
on:
  push:
    paths:
      - '.github/workflows/rift-publish-master-once.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rift-source-index
          fetch-depth: 1
          persist-credentials: true
      - name: Unpack full RU-first queue as downloader's canonical plain TXT input
        shell: bash
        run: |
          python - <<'PY'
          import gzip, json
          from pathlib import Path
          from urllib.parse import urlsplit
          from collections import Counter
          base=Path('source_discovery')
          gz=base/'targeted_results/ru_olympiad_20261029_ru_first_downloader_urls.txt.gz'
          plain=base/'download_master.txt'
          report=json.loads((base/'targeted_results/ru_olympiad_20261029_ru_first_summary.json').read_text(encoding='utf-8'))
          expected=report['files'][gz.name]['total']
          count=0; seen=set(); tiers=Counter(); previous=-1
          target_source=base/'targeted_results/ru_olympiad_20261029_priority_urls.txt'
          targeted={x.strip() for x in target_source.open(encoding='utf-8') if x.strip()}
          with gzip.open(gz,'rt',encoding='utf-8') as source, plain.open('w',encoding='utf-8',newline='\n') as output:
            for line in source:
              url=line.strip()
              if not url:continue
              assert url not in seen, 'Duplicate URL in canonical master'
              seen.add(url);count+=1
              h=(urlsplit(url).hostname or '').rstrip('.').lower()
              ru=h.endswith('.ru')
              priority=(0 if ru and url in targeted else 1 if ru else 2 if url in targeted else 3)
              assert priority>=previous, 'RU-first priority order violated'
              tiers[priority]+=1;previous=priority
              output.write(url+'\n')
          assert count==expected==386225, f'Incomplete queue {count} != 386225'
          assert [tiers[i] for i in range(4)]==[50952,12218,8133,314922], 'Tier counts changed unexpectedly'
          print('CANONICAL_MASTER_READY',str(plain),'urls',count,'bytes',plain.stat().st_size,'tiers',dict(tiers))
          PY
      - name: Confirm RIFT downloader accepts plain TXT input and preserves order
        shell: bash
        run: |
          python - <<'PY'
          from itertools import islice
          from rift_downloader.ordered_master import resolve_sources,iter_master
          names=resolve_sources('auto')
          assert names==['source_discovery/download_master.txt'],f'auto did not select canonical master: {names}'
          first=list(islice(iter_master('auto'),5))
          assert len(first)==5
          assert all(x[1]['url'].startswith('http') for x in first)
          print('AUTO_SELECTED',names[0])
          print('FIRST_URL',first[0][1]['url'])
          PY
      - name: Commit canonical master to rift-source-index (do not run downloader)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source_discovery/download_master.txt
          git commit -m "RIFT: publish RU-first 386225 URL canonical download_master.txt"
          git pull --rebase origin rift-source-index
          git push origin HEAD:rift-source-index
