name: RIFT Downloader Control Center
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Historical/live dashboard, new URLs, or due retries"
        required: true
        default: dashboard
        type: choice
        options:
          - dashboard
          - download-new
          - retry-failed
      url_count:
        description: "Number of distinct source URLs (1 through 1000)"
        required: true
        default: '200'
        type: string
      source_path:
        description: "Ordered URL master: auto prefers download_master.* then existing resource shards"
        required: false
        default: auto
        type: string
  # No new source-site HTTP requests until repo variable RIFT_AUTORUN_ENABLED=true.
  schedule:
    - cron: '17 2 * * *'
permissions:
  contents: read
concurrency:
  group: rift-downloader-google-drive
  cancel-in-progress: false
jobs:
  rift-worker:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.RIFT_AUTORUN_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      OPERATION: ${{ github.event_name == 'schedule' && 'download-new' || inputs.operation }}
      URL_COUNT: ${{ inputs.url_count || '200' }}
      SOURCE_PATTERN: ${{ inputs.source_path || vars.RIFT_MASTER_PATH || 'auto' }}
      OUT_DIR: rift-output
    steps:
      - name: Fetch trusted RIFT worker code and source URL index
        uses: actions/checkout@v4
        with:
          ref: rift-source-index
          persist-credentials: false
          sparse-checkout: |
            rift_downloader
            source_discovery
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install RIFT dependencies
        run: python -m pip install -q -r rift_downloader/requirements.txt
      - name: Prepare dashboard or process bounded source URL batch
        shell: bash
        env:
          RIFT_GOOGLE_TOKEN_JSON: ${{ secrets.RIFT_GOOGLE_TOKEN_JSON }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          if [[ "$OPERATION" == "dashboard" && -z "$RIFT_GOOGLE_TOKEN_JSON" ]]; then
            echo "No Drive token. Dashboard will be labeled HISTORICAL."
            python -m rift_downloader.ops_metrics --baseline \
              --output "$OUT_DIR/index.html" --json "$OUT_DIR/status.json"
            exit 0
          fi
          if [[ -z "$RIFT_GOOGLE_TOKEN_JSON" ]]; then
            echo "::error::Configure RIFT_GOOGLE_TOKEN_JSON as a GitHub Actions secret. Do not put credentials in workflow inputs."
            exit 1
          fi
          if ! [[ "$URL_COUNT" =~ ^[0-9]{1,4}$ ]] || (( 10#$URL_COUNT < 1 || 10#$URL_COUNT > 1000 )); then
            echo "::error::url_count must be from 1 to 1000"
            exit 1
          fi
          python - <<'PY'
          import os
          from pathlib import Path
          token=os.environ.pop("RIFT_GOOGLE_TOKEN_JSON")
          p=Path(os.environ["RUNNER_TEMP"])/"rift-google-token.json"
          p.write_text(token,encoding="utf-8")
          p.chmod(0o600)
          PY
          if [[ "$OPERATION" == "dashboard" ]]; then
            MODE=report
            QUEUE=new
          elif [[ "$OPERATION" == "retry-failed" ]]; then
            MODE=batch
            QUEUE=retry
          elif [[ "$OPERATION" == "download-new" ]]; then
            MODE=batch
            QUEUE=new
          else
            echo "::error::Unexpected RIFT operation"
            exit 1
          fi
          python -m rift_downloader.cloud_runner \
            --mode "$MODE" \
            --queue-mode "$QUEUE" \
            --source "$SOURCE_PATTERN" \
            --token "$RUNNER_TEMP/rift-google-token.json" \
            --drive-root-id "1uyPU91NHIfIf-wGXO5UAAnNCG9CqQD1o" \
            --limit-urls "$((10#$URL_COUNT))" \
            --max-checks "$((10#$URL_COUNT * 3))" \
            --workdir "$RUNNER_TEMP/rift-state" \
            --output-dir "$OUT_DIR" \
            --run-id "$GITHUB_RUN_ID"
      - name: Render summary in GitHub Actions
        if: always()
        shell: bash
        run: |
          if [[ -f "$OUT_DIR/github_step_summary.md" ]]; then
            cat "$OUT_DIR/github_step_summary.md" >> "$GITHUB_STEP_SUMMARY"
          elif [[ -f "$OUT_DIR/status.json" ]]; then
            echo "RIFT: historical-only dashboard, not a live downloader run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "RIFT: no data was generated. Check the failure logs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve HTML dashboard and aggregate status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rift-dashboard-${{ github.run_id }}
          path: |
            rift-output/index.html
            rift-output/status.json
            rift-output/run_result.json
            rift-output/github_step_summary.md
            rift-output/reports_drive_upload.json
          retention-days: 30
          if-no-files-found: warn
