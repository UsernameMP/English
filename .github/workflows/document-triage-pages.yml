name: Document Triage Pages

on:
  push:
    branches: [main]
    paths:
      - "tools/document_triage/**"
      - "tools/corpus_ingest/layout.py"
      - "tools/corpus_ingest/task_structure.py"
      - "tools/corpus_ingest/calibration_eval.py"
      - ".github/workflows/document-triage-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: document-triage-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install layout dependency
        run: pip install "PyMuPDF>=1.24,<2"

      - name: Build review assets
        run: |
          python - <<'PY'
          import hashlib
          import importlib.util
          import json
          import urllib.error
          import urllib.request
          from pathlib import Path

          root = Path("tools/document_triage")
          assets = root / "assets"
          assets.mkdir(parents=True, exist_ok=True)
          known_sources = json.loads((root / "source_urls.json").read_text(encoding="utf-8"))
          batch_file = root / "review_batch_urls.json"
          batch = json.loads(batch_file.read_text(encoding="utf-8")) if batch_file.exists() else {"documents": []}

          spec = importlib.util.spec_from_file_location("layout", "tools/corpus_ingest/layout.py")
          layout_mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(layout_mod)

          task_spec = importlib.util.spec_from_file_location("task_structure", "tools/corpus_ingest/task_structure.py")
          task_mod = importlib.util.module_from_spec(task_spec)
          task_spec.loader.exec_module(task_mod)

          manifest = {}
          resolved_sources = dict(known_sources)
          review_batch = []

          def download(url: str, target: Path) -> bool:
              req = urllib.request.Request(url, headers={"User-Agent": "OlympiadCorpus-Review/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      target.write_bytes(response.read())
                  return True
              except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError) as exc:
                  print(f"skip {url}: {exc}")
                  return False

          def build_one(source_url: str, expected_sha: str | None = None, batch_meta: dict | None = None):
              name = source_url.rsplit("/", 1)[-1]
              temp = assets / (f"{expected_sha}.pdf" if expected_sha else "_candidate.pdf")
              if not download(source_url, temp):
                  return None

              data = temp.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              if expected_sha and sha != expected_sha:
                  raise RuntimeError(f"sha mismatch for {expected_sha}: {sha}")

              pdf_path = assets / f"{sha}.pdf"
              if temp != pdf_path:
                  if pdf_path.exists():
                      temp.unlink()
                  else:
                      temp.rename(pdf_path)

              layout = layout_mod.extract_pdf_layout(data, sha)
              layout_path = assets / f"{sha}.layout.json"
              layout_path.write_bytes(layout_mod.dumps_layout(layout))

              structure = task_mod.propose_structure(layout, filename=name)
              structure_path = assets / f"{sha}.structure.json"
              structure_path.write_text(
                  json.dumps(structure, ensure_ascii=False, indent=2),
                  encoding="utf-8",
              )

              item = {
                  "pdf": f"assets/{sha}.pdf",
                  "layout": f"assets/{sha}.layout.json",
                  "structure": f"assets/{sha}.structure.json",
                  "source_pdf": source_url,
              }
              if batch_meta:
                  item["review_batch"] = batch.get("batch_id", "")
                  item["review_label"] = batch_meta.get("label", "")

              # Audio discovery is English-specific. Do not generate 404 requests
              # for every tasks-* document in the multi-subject validation batch.
              if "-engl-" in name and name.startswith("tasks-") and name.endswith(".pdf"):
                  audio_name = "audio-" + name[len("tasks-"):-4] + ".mp3"
                  audio_source = source_url.rsplit("/", 1)[0] + "/" + audio_name
                  audio_path = assets / f"{sha}.mp3"
                  if download(audio_source, audio_path):
                      item["audio"] = f"assets/{sha}.mp3"
                      item["source_audio"] = audio_source
                      item["audio_sha256"] = hashlib.sha256(audio_path.read_bytes()).hexdigest()

              manifest[sha] = item
              resolved_sources[sha] = source_url
              return sha

          for sha, source_url in known_sources.items():
              build_one(source_url, expected_sha=sha)

          for index, candidate in enumerate(batch.get("documents", []), start=1):
              sha = build_one(candidate["url"], batch_meta=candidate)
              if sha:
                  review_batch.append({
                      "order": index,
                      "sha256": sha,
                      "label": candidate.get("label", ""),
                      "url": candidate["url"],
                  })

          (root / "deployed_assets.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          (root / "resolved_sources.json").write_text(
              json.dumps(resolved_sources, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          (root / "review_batch_resolved.json").write_text(
              json.dumps({
                  "schema_version": "review-batch-resolved.v1",
                  "batch_id": batch.get("batch_id", ""),
                  "documents": review_batch,
              }, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps({
              "assets": len(manifest),
              "review_batch": review_batch,
          }, ensure_ascii=False, indent=2))
          PY

      - name: Evaluate task structure against reviewed calibration
        run: |
          PYTHONPATH=tools/corpus_ingest python tools/corpus_ingest/calibration_eval.py \
            --gold tools/document_triage/calibration_gold.json \
            --structures tools/document_triage/assets \
            --output tools/document_triage/calibration_report.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Document Triage
        uses: actions/upload-pages-artifact@v4
        with:
          path: tools/document_triage

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
