name: Android Pilot APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate content bank
        run: python3 scripts/validate_content.py

      - name: Cache neural TTS
        uses: actions/cache@v4
        with:
          path: .cache/piper
          key: piper-en-us-lessac-ryan-medium-v2

      - name: Generate offline neural listening WAVs
        run: bash scripts/generate_audio.sh

      - name: Read app version
        run: |
          VERSION_NAME="$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -n1)"
          VERSION_CODE="$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' app/build.gradle | head -n1)"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "APK_NAME=english-sprint-v${VERSION_NAME}-pilot.apk" >> "$GITHUB_ENV"

      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Fetch public AOSP pilot signing key
        run: |
          mkdir -p "$RUNNER_TEMP/aosp-testkey"
          curl -L --fail --retry 3 \
            "https://android.googlesource.com/platform/build/+/refs/heads/main/target/product/security/testkey.pk8?format=TEXT" \
            | base64 -d > "$RUNNER_TEMP/aosp-testkey/testkey.pk8"
          curl -L --fail --retry 3 \
            "https://android.googlesource.com/platform/build/+/refs/heads/main/target/product/security/testkey.x509.pem?format=TEXT" \
            | base64 -d > "$RUNNER_TEMP/aosp-testkey/testkey.x509.pem"

      - name: Sign stable pilot APK
        run: |
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/english-sprint-aligned.apk"
          APK="$APK_NAME"

          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --key "$RUNNER_TEMP/aosp-testkey/testkey.pk8" \
            --cert "$RUNNER_TEMP/aosp-testkey/testkey.x509.pem" \
            --out "$APK" \
            "$ALIGNED"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: english-sprint-v${{ env.VERSION_NAME }}-pilot
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK update channel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          APK="$APK_NAME"
          SIZE="$(stat -c%s "$APK")"

          mkdir -p /tmp/english-sprint-dist
          cp "$APK" /tmp/english-sprint-dist/english-sprint-latest.apk
          cp "$APK" "/tmp/english-sprint-dist/english-sprint-v${VERSION_NAME}-pilot.apk"

          cat > /tmp/english-sprint-dist/latest.json <<EOF
          {
            "versionName": "${VERSION_NAME}",
            "versionCode": ${VERSION_CODE},
            "apkUrl": "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/apk-dist/english-sprint-latest.apk",
            "sizeBytes": ${SIZE},
            "commit": "${GITHUB_SHA}"
          }
          EOF

          git config user.name "English Sprint CI"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan apk-dist-publish
          git rm -rf . || true
          git clean -fdx
          cp /tmp/english-sprint-dist/* .
          git add english-sprint-latest.apk "english-sprint-v${VERSION_NAME}-pilot.apk" latest.json
          git commit -m "Publish English Sprint v${VERSION_NAME} pilot"
          git push origin HEAD:apk-dist --force
