name: Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate content bank
        run: python3 scripts/validate_content.py

      - name: Cache neural TTS
        uses: actions/cache@v4
        with:
          path: .cache/piper
          key: piper-en-us-lessac-medium-v1

      - name: Generate offline neural listening WAVs
        run: bash scripts/generate_audio.sh

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk english-sprint-v0.4.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: english-sprint-v0.4.0
          path: english-sprint-v0.4.0-debug.apk
          if-no-files-found: error
          retention-days: 14
