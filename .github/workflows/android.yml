name: Rift Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate vendored mini-games
        run: |
          test -f app/src/main/assets/games/2048/LICENSE.txt
          test -f app/src/main/assets/games/2048/index.html
          test -f app/src/main/assets/games/tower/LICENSE
          test -f app/src/main/assets/games/tower/index.html
          test -f app/src/main/assets/games/suika/LICENSE
          test -f app/src/main/assets/games/suika/index.html
          test -f app/src/main/assets/games/match3/LICENSE
          test -f app/src/main/assets/games/match3/match3.html
          test -f app/src/main/assets/games/bubble/LICENSE
          test -f app/src/main/assets/games/bubble/bubble-shooter.html
          test -f app/src/main/assets/games/cozy/LICENSE
          test -f app/src/main/assets/games/cozy/index.html
          test -f app/src/main/assets/game_custom/match3/index.html
          test -f app/src/main/assets/game_custom/match3/game.js
          node --check app/src/main/assets/game_custom/match3/game.js

      - name: Validate content bank
        run: python3 scripts/validate_content.py

      - name: Validate 5th-grade informatics bank and answer keys
        run: python3 scripts/validate_informatics_g5.py

      - name: Validate Russian STEM task localization
        run: python3 scripts/validate_stem_locale.py

      - name: Enforce Atlas and interaction coverage
        run: |
          python3 -m unittest discover -s tools/corpus_ingest/tests -p 'test_coverage.py'
          python3 tools/corpus_ingest/coverage.py --min-runnable 0.95 --output build/reports/content-coverage.json

      - name: Verify reproducible pack manifests
        run: python3 scripts/publish_content_pack.py

      - name: Validate task generator
        run: python3 scripts/validate_generator.py

      - name: Validate metagame economy
        run: python3 scripts/validate_metagame.py

      - name: Cache neural TTS
        uses: actions/cache@v4
        with:
          path: .cache/piper
          key: piper-en-us-lessac-ryan-medium-v2

      - name: Generate offline neural listening WAVs
        run: bash scripts/generate_audio.sh

      - name: Read app version
        run: |
          VERSION_NAME="$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -n1)"
          VERSION_CODE="$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' app/build.gradle | head -n1)"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "APK_NAME=rift-v${VERSION_NAME}-pilot.apk" >> "$GITHUB_ENV"

      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Fetch public AOSP pilot signing key
        run: |
          mkdir -p "$RUNNER_TEMP/aosp-testkey"
          curl -L --fail --retry 3 \
            "https://android.googlesource.com/platform/build/+/refs/heads/main/target/product/security/testkey.pk8?format=TEXT" \
            | base64 -d > "$RUNNER_TEMP/aosp-testkey/testkey.pk8"
          curl -L --fail --retry 3 \
            "https://android.googlesource.com/platform/build/+/refs/heads/main/target/product/security/testkey.x509.pem?format=TEXT" \
            | base64 -d > "$RUNNER_TEMP/aosp-testkey/testkey.x509.pem"

      - name: Sign stable pilot APK
        run: |
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/rift-aligned.apk"
          APK="$APK_NAME"

          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --key "$RUNNER_TEMP/aosp-testkey/testkey.pk8" \
            --cert "$RUNNER_TEMP/aosp-testkey/testkey.x509.pem" \
            --out "$APK" \
            "$ALIGNED"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: rift-v${{ env.VERSION_NAME }}-pilot
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish public pilot content channel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/publish_github_content.py
          rm -rf "$RUNNER_TEMP/content-pilot-repo"
          mkdir -p "$RUNNER_TEMP/content-pilot-repo"
          cp -R build/content-pilot/. "$RUNNER_TEMP/content-pilot-repo/"
          cd "$RUNNER_TEMP/content-pilot-repo"
          git init
          git config user.name "Rift CI"
          git config user.email "actions@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout --orphan content-pilot-publish
          git add .
          git commit -m "Publish pilot content"
          git push origin HEAD:content-pilot --force

      - name: Publish GitHub Release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION_NAME}"
          RELEASE_APK="rift-v${VERSION_NAME}-pilot.apk"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG" --force
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME#$RELEASE_APK" --clobber
          else
            gh release create "$TAG" "$APK_NAME#$RELEASE_APK" \
              --title "Rift ${VERSION_NAME}" \
              --notes "Rift pilot Android build ${VERSION_NAME}. Download the APK asset below."
          fi

      - name: Publish updater manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          APK="$APK_NAME"
          SIZE="$(stat -c%s "$APK")"
          RELEASE_APK="rift-v${VERSION_NAME}-pilot.apk"
          mkdir -p /tmp/english-sprint-dist
          cat > /tmp/english-sprint-dist/latest.json <<EOF
          {
            "versionName": "${VERSION_NAME}",
            "versionCode": ${VERSION_CODE},
            "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION_NAME}/${RELEASE_APK}",
            "sizeBytes": ${SIZE},
            "commit": "${GITHUB_SHA}"
          }
          EOF
          git config user.name "Rift CI"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan apk-dist-publish
          git rm -rf . || true
          git clean -fdx
          cp /tmp/english-sprint-dist/latest.json .
          git add latest.json
          git commit -m "Publish Rift v${VERSION_NAME} updater manifest"
          git push origin HEAD:apk-dist --force
