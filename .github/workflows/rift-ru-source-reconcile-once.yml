name: RIFT Russian olympiad seed coverage audit (one-time)
on:
  push:
    paths:
      - '.github/workflows/rift-ru-source-reconcile-once.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rift-source-index
          fetch-depth: 1
          persist-credentials: true
      - name: Compare 171 seeds against all discovered resources and crawler state
        shell: bash
        run: |
          python - <<'PY'
          import json,csv,collections,pathlib,urllib.parse,datetime,ipaddress
          root=pathlib.Path('source_discovery')
          targets=[s.strip() for s in (root/'targeted_seeds/olympiad_centres_ru_20261029.txt').read_text(encoding='utf-8').splitlines() if s.strip() and not s.startswith('#')]
          def host(url):
            try:
              h=(urllib.parse.urlsplit(url).hostname or '').strip('.').lower()
              return h.encode('idna').decode('ascii') if h else ''
            except Exception:return ''
          def same_site(u,h):
            uh=host(u)
            return uh==h or uh=='www.'+h or (h.startswith('www.') and uh==h[4:]) or uh.endswith('.'+h)
          def canonical(u):
            try:
              p=urllib.parse.urlsplit(u.strip())
              return (host(u),(p.path or '/').rstrip('/') or '/',p.query)
            except Exception:return ('','','')
          target_hosts=sorted({host(u) for u in targets})
          R={h:collections.Counter() for h in target_hosts}
          examples={h:[] for h in target_hosts}
          target_canons={canonical(u) for u in targets}
          target_keys={h for h in target_hosts}
          def matches(u):
            h=host(u)
            return [k for k in target_keys if h==k or h=='www.'+k or (k.startswith('www.') and h==k[4:]) or h.endswith('.'+k)]
          resource_urls=set()
          for fn in sorted((root/'resources_shards').glob('resource_*.jsonl')):
            for line in fn.open(encoding='utf-8'):
              try:x=json.loads(line)
              except:continue
              u=x.get('url') or ''
              cu=canonical(u)
              resource_urls.add(cu)
              for h in matches(u):
                R[h]['unique_resource_urls']+=1
                if x.get('file_candidate') or (x.get('mime') or '').startswith('application/pdf'):
                  R[h]['file_candidates']+=1
                if len(examples[h])<2 and (x.get('file_candidate') or '/olymp' in u or 'зада' in u):
                  examples[h].append(u)
          raw_lines=0
          for fn in sorted((root/'links_shards').glob('batch_*.jsonl')):
            for line in fn.open(encoding='utf-8'):
              raw_lines+=1
              try:x=json.loads(line)
              except:continue
              for h in matches(x.get('url') or ''):R[h]['raw_link_occurrences']+=1
          sources=[]
          for line in (root/'sources.jsonl').open(encoding='utf-8'):
            try:sources.append(json.loads(line))
            except:pass
          state=json.loads((root/'crawl_state.json').read_text(encoding='utf-8'))
          visited=state.get('visited') or []
          queue=state.get('queue') or []
          for u in visited:
            for h in matches(u):R[h]['visited_pages']+=1
          for t in queue:
            for h in matches(t.get('url') or ''):R[h]['pending_pages']+=1
          for s in sources:
            for h in matches(s.get('url') or ''):R[h]['registered_sources']+=1
          results=[]
          for u in targets:
            h=host(u);d=R[h];c=canonical(u)
            entry={
              'seed_url':u,'host':h,'exact_seed_in_resource_index':int(c in resource_urls),
              'seed_visited':int(c in {canonical(v) for v in visited if same_site(v,h)}),
              'same_host_unique_resources':d['unique_resource_urls'],
              'same_host_raw_occurrences':d['raw_link_occurrences'],
              'same_host_file_candidates':d['file_candidates'],
              'same_host_visited_pages':d['visited_pages'],
              'same_host_pending_pages':d['pending_pages'],
              'same_host_registered_sources':d['registered_sources'],
              'examples':' | '.join(examples[h]),
            }
            entry['coverage']=('SEED_VISITED' if entry['seed_visited'] else 'SEED_LINK_INDEXED' if entry['exact_seed_in_resource_index'] else 'DOMAIN_DISCOVERED' if entry['same_host_unique_resources'] else 'DOMAIN_ABSENT')
            results.append(entry)
          out=root/'audits';out.mkdir(exist_ok=True)
          p=out/'ru_olympiad_171_seed_coverage_20261029.csv'
          with p.open('w',newline='',encoding='utf-8') as f:
            w=csv.DictWriter(f,fieldnames=results[0].keys());w.writeheader();w.writerows(results)
          stat=dict(collections.Counter(r['coverage'] for r in results))
          summary={'audit_date':'2026-10-29','seed_count':len(targets),'unique_host_count':len(target_hosts),'resource_rows':len(resource_urls),'raw_occurrence_rows':raw_lines,'crawler_visited_pages':len(visited),'crawler_pending_pages':len(queue),'coverage_counts':stat,'notable':[r for r in results if any(z in r['host'] for z in ['olimpiada.ru','anokmc.ru','olimpinno.ru','vserosolimp.edsoo.ru','olimprocrt.ru'])]}
          q=out/'ru_olympiad_171_seed_coverage_20261029_summary.json'
          q.write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('COVERAGE_SUMMARY_START')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          print('COVERAGE_SUMMARY_END')
          PY
      - name: Commit audit only (no crawler/RAW changes)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source_discovery/audits/ru_olympiad_171_seed_coverage_20261029.csv source_discovery/audits/ru_olympiad_171_seed_coverage_20261029_summary.json
          git diff --cached --quiet && exit 0
          git commit -m "audit: match 171 RU olympiad seeds to 332k resources and crawl state"
          git pull --rebase origin rift-source-index
          git push origin HEAD:rift-source-index
