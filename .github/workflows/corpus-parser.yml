name: Olympiad corpus parser

# LINK-ONLY MODE: no scheduled or push-triggered Dropbox RAW ingestion.
# A manual run requires BOTH explicit checkbox and a repository variable.
on:
  workflow_dispatch:
    inputs:
      enable_raw_pipeline:
        description: "Explicit opt-in required; RAW writes are otherwise disabled"
        required: true
        type: boolean
        default: false
      max_documents:
        description: Maximum documents in an explicitly enabled run
        required: false
        default: "20"

permissions:
  contents: read
  actions: write

concurrency:
  group: olympiad-parser
  cancel-in-progress: false

jobs:
  parse:
    if: ${{ inputs.enable_raw_pipeline == true && vars.RIFT_ENABLE_RAW_PIPELINE == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: tools/corpus_ingest
    env:
      RIFT_ALLOW_RAW_INGEST: "true"
      DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
      DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
      DROPBOX_ROOT: /OlympiadCorpus
      PARSER_MAX_DOCUMENTS: ${{ github.event.inputs.max_documents || '20' }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install parser dependencies
        run: pip install -r parser_requirements.txt

      - name: Test parser
        run: PYTHONPATH=. pytest -q tests/test_parser.py tests/test_layout.py tests/test_task_structure.py tests/test_calibration_eval.py tests/test_corpus_graph.py tests/test_crawler.py

      - name: Check reconstruction Workbench JavaScript
        working-directory: .
        run: |
          node --check tools/document_triage/arm-core.js
          node --check tools/document_triage/arm-viewer.js
          node --check tools/document_triage/arm-pass2.js

      - name: Parse Dropbox RAW into canonical layout
        if: github.event_name != 'push'
        run: python parser.py --max-documents "$PARSER_MAX_DOCUMENTS"
