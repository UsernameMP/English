<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Document Triage Workbench</title>
<link rel="stylesheet" href="styles.css">
<link id="nextPrefetch" rel="prefetch" as="document">
</head>
<body>
<header>
  <h1 id="appTitle"></h1>
  <div class="header-right">
    <div class="progress" id="progress"></div>
    <select id="langSwitch" class="lang-switch" aria-label="Language">
      <option value="ru">Русский</option>
      <option value="en">English</option>
    </select>
  </div>
</header>
<main>
<section class="viewer">
  <div class="viewerbar">
    <div class="nav"><button id="prevBtn"></button><button id="nextBtn"></button></div>
    <span class="pill" id="indexPill"></span>
    <div class="sha" id="shaLabel"></div>
    <span class="viewer-status" id="viewerStatus"></span>
    <a class="buttonlink" id="openPdf" target="_blank" rel="noopener"></a>
  </div>
  <iframe id="docFrame" title="Source document"></iframe>
</section>

<aside class="panel">
  <div class="statusline">
    <span class="pill" id="sizePill"></span>
    <span id="savedState" class="muted"></span>
  </div>

  <div class="card">
    <h2 id="rolesTitle"></h2>
    <div class="checks" id="roles"></div>
  </div>

  <div class="card">
    <h2 id="metadataTitle"></h2>
    <div class="grid2">
      <div><div class="field-label" id="subjectLabel"></div><select id="subject"></select></div>
      <div><div class="field-label" id="competitionLabel"></div><select id="competition"></select></div>
      <div id="competitionOtherWrap" class="hidden"><div class="field-label"><span id="competitionOtherLabel"></span></div><input id="competitionOther" type="text"></div>
      <div><div class="field-label" id="yearLabel"></div><input id="year" type="text" placeholder="2025/26"></div>
      <div><div class="field-label" id="stageLabel"></div><select id="stage"></select></div>
      <div><div class="field-label" id="gradesLabel"></div><input id="grades" type="text"></div>
      <div><div class="field-label" id="regionLabel"></div><input id="region" type="text"></div>
      <div><div class="field-label" id="tourLabel"></div><select id="tour"></select></div>
      <div><div class="field-label" id="durationLabel"></div><input id="duration" type="number" min="0"></div>
      <div><div class="field-label" id="maxScoreLabel"></div><input id="maxScore" type="number" min="0" step="0.5"></div>
      <div><div class="field-label" id="reviewStatusLabel"></div><select id="reviewStatus"></select></div>
    </div>
  </div>

  <details class="card">
    <summary id="signalsTitle"></summary>
    <div class="details-body">
      <div class="checks" id="signals"></div>
      <div class="optional-note" id="signalsNote"></div>
    </div>
  </details>

  <details class="card">
    <summary id="notesTitle"></summary>
    <div class="details-body"><textarea id="notes"></textarea></div>
  </details>

  <div class="actions">
    <button class="primary" id="saveBtn"></button>
    <button id="saveStayBtn"></button>
    <button id="exportJsonl"></button>
    <button id="exportCsv"></button>
  </div>
</aside>
</main>
<script src="app.js"></script>
</body>
</html>
