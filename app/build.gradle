plugins { id 'com.android.application' }
android {
 namespace 'com.usernamemp.englishsprint'
 compileSdk 35
 defaultConfig { ndk { abiFilters 'arm64-v8a' }; applicationId "com.usernamemp.englishsprint"; minSdk 24; targetSdk 35; versionCode 45; versionName "0.6.38" }
 buildFeatures { buildConfig true }
 buildTypes { release { minifyEnabled false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 implementation 'androidx.core:core:1.15.0'
 implementation 'androidx.webkit:webkit:1.12.1'
 implementation 'com.github.k2-fsa.sherpa-onnx:sherpa-onnx:v1.13.8'
}

/** Fail closed if the exact upstream T-One 71M ONNX model is absent or altered. */
tasks.register('verifyBundledRussianModel') {
    doLast {
        def folder = file('src/main/assets/models/t-one-71m')
        def model = new File(folder, 'model.onnx')
        def tokens = new File(folder, 'tokens.txt')
        if (!model.isFile() || !tokens.isFile())
            throw new GradleException('Required bundled T-One model and vocabulary missing')
        if (model.length() != 144193702L)
            throw new GradleException('T-One ONNX size mismatch')
        def md = java.security.MessageDigest.getInstance('SHA-256')
        model.withInputStream { ins ->
            byte[] buffer = new byte[65536]
            int n
            while ((n = ins.read(buffer)) != -1) if (n > 0) md.update(buffer, 0, n)
        }
        def actual = md.digest().collect { String.format('%02x', it & 255) }.join('')
        if (actual != '5ded080e2a6c86ecc11bcb0902d77524eb3e8b0844cb0c0754347f5aafb4dabc')
            throw new GradleException('Bundled T-One model SHA-256 mismatch')
        if (!tokens.getText('UTF-8').contains('<blk> 34'))
            throw new GradleException('T-One blank vocabulary symbol missing')
    }
}
tasks.named('preBuild').configure { dependsOn tasks.named('verifyBundledRussianModel') }
