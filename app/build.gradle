plugins { id 'com.android.application' }
android {
 namespace 'com.usernamemp.englishsprint'
 compileSdk 35
 defaultConfig { applicationId "com.usernamemp.englishsprint"; minSdk 24; targetSdk 35; versionCode 43; versionName "0.6.36" }
 buildFeatures { buildConfig true }
 buildTypes { release { minifyEnabled false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 implementation 'androidx.core:core:1.15.0'
 implementation 'androidx.webkit:webkit:1.12.1'
 implementation 'com.alphacephei:vosk-android:0.3.75'
}

/** A release without the promised bundled offline model must fail at build time. */
tasks.register('verifyBundledRussianModel') {
    doLast {
        def archive = file('src/main/assets/models/vosk-model-small-ru-0.22.zip')
        def expected = '961d5ff98a17f4aa6de69864d0aa71fa5bac682301d2b5d17a3f24c5c99a46d4'
        if (!archive.isFile()) throw new GradleException('RIFT offline RU ASR model is missing from APK assets')
        def md = java.security.MessageDigest.getInstance('SHA-256')
        archive.withInputStream { ins ->
            byte[] buffer = new byte[65536]
            int n
            while ((n = ins.read(buffer)) != -1) if (n > 0) md.update(buffer, 0, n)
        }
        def actual = md.digest().collect { String.format('%02x', it & 255) }.join('')
        if (actual != expected) throw new GradleException('Offline RU model checksum mismatch')
    }
}
tasks.named('preBuild').configure { dependsOn tasks.named('verifyBundledRussianModel') }
