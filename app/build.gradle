plugins {
    id 'com.android.application'
}

android {
    namespace 'com.usernamemp.englishsprint'
    compileSdk 35

    defaultConfig {
        applicationId "com.usernamemp.englishsprint"
        minSdk 24
        targetSdk 35
        versionCode 12
        versionName "0.6.5"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    implementation 'androidx.core:core:1.15.0'
}
